name: agent-diff-checks

# Flags files a pull request deletes although its task did not ask for it
# (https://github.com/fagiampa/agent-diff-checks). A finding is a grey
# "neutral" check and one PR comment: worth a look, never a failed build.
# The task is read from the issues the PR closes ("Fixes #12"), or else from
# the PR's own title and description.

on: pull_request

permissions:
  contents: read
  pull-requests: write
  issues: read
  checks: write

jobs:
  agent-diff-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: fagiampa/agent-diff-checks@v0
